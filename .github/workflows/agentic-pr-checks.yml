name: Agentic PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentic-pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-lockfile:
    name: Install and lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Foundry
        # foundry-rs/foundry-toolchain@v1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry library dependencies
        run: bash scripts/ci/install-foundry-dependencies.sh

      - name: Verify Foundry dependency preflight
        run: |
          test -f lib/forge-std/src/Test.sol || { echo "missing lib/forge-std/src/Test.sol"; exit 1; }
          test -f lib/openzeppelin-contracts/contracts/access/manager/AccessManager.sol || { echo "missing lib/openzeppelin-contracts/contracts/access/manager/AccessManager.sol"; exit 1; }

      - name: Run Forge tests
        run: pnpm forge:test

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Hardhat artifacts for web tests
        run: pnpm hh:compile

      - name: Verify web-required Hardhat artifacts
        run: |
          test -s artifacts/contracts/modules/factories/GovernanceLayerFactory.sol/GovernanceLayerFactory.json
          test -s artifacts/contracts/modules/factories/VerificationLayerFactory.sol/VerificationLayerFactory.json
          test -s artifacts/contracts/modules/factories/EconomicLayerFactory.sol/EconomicLayerFactory.json
          test -s artifacts/contracts/modules/factories/CommerceLayerFactory.sol/CommerceLayerFactory.json
          test -s artifacts/contracts/modules/factories/CoordinationLayerFactory.sol/CoordinationLayerFactory.json
          test -s artifacts/contracts/tokens/MembershipTokenERC20Votes.sol/MembershipTokenERC20Votes.json
          test -s artifacts/contracts/core/ShiftTimelockController.sol/ShiftTimelockController.json
          test -s artifacts/contracts/core/ShiftGovernor.sol/ShiftGovernor.json
          test -s artifacts/contracts/core/CountingMultiChoice.sol/CountingMultiChoice.json
          test -s artifacts/contracts/tokens/VerifierPowerToken1155.sol/VerifierPowerToken1155.json
          test -s artifacts/contracts/modules/VerifierElection.sol/VerifierElection.json
          test -s artifacts/contracts/modules/VerifierManager.sol/VerifierManager.json
          test -s artifacts/contracts/modules/ValuableActionRegistry.sol/ValuableActionRegistry.json
          test -s artifacts/contracts/modules/ValuableActionSBT.sol/ValuableActionSBT.json
          test -s artifacts/contracts/modules/Engagements.sol/Engagements.json
          test -s artifacts/contracts/modules/PositionManager.sol/PositionManager.json
          test -s artifacts/contracts/modules/CredentialManager.sol/CredentialManager.json
          test -s artifacts/contracts/modules/CohortRegistry.sol/CohortRegistry.json
          test -s artifacts/contracts/modules/InvestmentCohortManager.sol/InvestmentCohortManager.json
          test -s artifacts/contracts/modules/RevenueRouter.sol/RevenueRouter.json
          test -s artifacts/contracts/tokens/CommunityToken.sol/CommunityToken.json
          test -s artifacts/contracts/modules/TreasuryAdapter.sol/TreasuryAdapter.json
          test -s artifacts/contracts/modules/CommerceDisputes.sol/CommerceDisputes.json
          test -s artifacts/contracts/modules/Marketplace.sol/Marketplace.json
          test -s artifacts/contracts/modules/HousingManager.sol/HousingManager.json
          test -s artifacts/contracts/modules/ProjectFactory.sol/ProjectFactory.json
          test -s artifacts/contracts/modules/RequestHub.sol/RequestHub.json
          test -s artifacts/contracts/modules/DraftsManager.sol/DraftsManager.json
          test -s artifacts/contracts/core/ShiftAccessManager.sol/ShiftAccessManager.json

      - name: Run web unit tests
        run: pnpm --filter @shift/web test:unit

  indexer-unit:
    name: Indexer unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        # actions/checkout@v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup pnpm
        # pnpm/action-setup@v4
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run indexer unit tests
        run: pnpm --filter @shift/indexer run test:unit
