# Seeded into $HERMES_HOME/config.yaml on first bootstrap. Afterwards Hermes
# (and you) own the file; bootstrap.sh only re-asserts the repo-managed keys
# listed in hermes-bootstrap/managed-keys.yaml.
model:
  provider: openrouter
  default: anthropic/claude-fable-5

terminal:
  backend: local
  cwd: /workspace/shift
  home_mode: profile

skills:
  external_dirs:
    - /workspace/shift/hermes-bootstrap/skills

mcp_servers:
  linear:
    url: https://mcp.linear.app/mcp
    headers:
      Authorization: "Bearer ${LINEAR_API_KEY}"

delegation:
  max_concurrent_children: 3
  max_spawn_depth: 2
  orchestrator_enabled: true

agent:
  max_turns: 500

checkpoints:
  enabled: true
  max_snapshots: 20

cron:
  provider: ""
  max_parallel_jobs: 1

kanban:
  auto_decompose: false
  orchestrator_profile: default

curator:
  enabled: true
  interval_hours: 24

toolsets:
  cli:
    - terminal
    - file
    - skills
    - memory
    - delegation
    - cron
    - kanban
