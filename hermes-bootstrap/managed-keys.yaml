# Keys owned by the repository. bootstrap.sh deep-merges these into the
# persistent $HERMES_HOME/config.yaml on every bootstrap, so reviewed changes
# here reach existing deployments. Everything else in config.yaml is left to
# Hermes and the operator.
skills:
  external_dirs:
    # Development skills: live from the reviewed main checkout.
    - /workspace/shift/hermes-bootstrap/skills
    # Content skills: shipped in the image from the deployed git ref.
    - /opt/shift-hermes/bootstrap/content-skills

# Agent terminal: run with the hermes user's real HOME (/opt/data), where gh,
# git, Claude Code, gentle-ai and Engram are configured. `profile` would use
# /opt/data/home and lose all of that. Hermes strips secret-looking variables
# from terminal subprocesses. GH_TOKEN/GITHUB_TOKEN/ANTHROPIC_API_KEY are
# hard-blocked (provider credentials) and cannot be passed through: gh uses
# the persisted login from bootstrap.sh, and Claude Code needs
# CLAUDE_CODE_OAUTH_TOKEN.
terminal:
  home_mode: real
  env_passthrough:
    - CLAUDE_CODE_OAUTH_TOKEN

mcp_servers:
  linear:
    url: https://mcp.linear.app/mcp
    headers:
      Authorization: "Bearer ${LINEAR_API_KEY}"
  escarlet:
    url: "${ESCARLET_MCP_URL}"
    headers:
      Authorization: "Bearer ${ESCARLET_MCP_TOKEN}"

# Image generation for content jobs (Instagram slides with rendered text).
image_gen:
  provider: openrouter

cron:
  max_parallel_jobs: 1

# Hermes memory is shared by every job and injected into every session. Per-PR
# lessons live in Engram (shift-post-merge-learning); this budget only has to
# hold runtime facts plus the content jobs' state, which overflowed 2200 chars.
memory:
  memory_char_limit: 4000
